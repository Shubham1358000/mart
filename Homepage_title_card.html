<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<style>
    /* Shared layout */
    * {
        box-sizing: border-box;
        font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif
    }

    body {
        margin: 0;
        /* background: #f6f8fb; */
         background: linear-gradient(135deg, #dff5e1, #f4f9e8);
        color: #0f1724
    }

    .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 24px
    }

    h1 {
        font-size: 28px;
        margin: 0 0 20px;
        text-align: center;
    }

    .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px
    }

    /* Card */
    .card {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 6px 18px rgba(12, 24, 40, 0.06);
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 220px
    }

    .card_emoji {
        font-size: 38px;
        display: flex;
        gap: 6px;
        margin-left: 13px;
        
    }

    .card_title-box h2 {
        font-size: 18px;
        margin: 6px 0;
        text-align:center;
        color: #06202b
    }

    .card_details {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin-top: auto
    }

    .card_details-box h6 {
        margin: 0;
        font-weight: 600;
        color: #334155;
        font-size: 14px
    }

    .card_detail-price {
        color: #0b8d6d
    }

    .card_link {
        display: inline-block;
        margin-top: 8px;
        text-decoration: none;
        color: #0b61ff;
        font-weight: 600
    }

    .card_link span {
        display: inline-flex;
        align-items: center;
        gap: 8px
    }

    .emoji-right {
        width: 12px;
        height: 12px;
        display: inline-block;
        background: linear-gradient(90deg, #0b61ff, #00c6ff);
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="white" d="M8 5l8 7-8 7V5z"/></svg>') no-repeat center/contain
    }

    /* Responsive tweaks */
    @media (max-width:480px) {
        .container {
            padding: 12px
        }

        h1 {
            font-size: 20px
        }

        .card {
            padding: 12px
        }

        .card_emoji{
             margin-left: 13dvw;
        }
    }
</style>
</head>

<body>

    <div class="container">
        <h1>🪴 Node farm 🌱</h1>
        <div class="card-container">
            {%product_card%}

            <figure class="card">
        <div class="card_emoji">{%image%}{%image%}</div>
        <div class="card_title-box">
            <h2 card_title>{%productName%}</h2>
        </div>

        <div class="card_details">
            <div class="card_details-box">
                <h6 class="card_details">{%quantity%} per 📦</h6>
            </div>

            <div class="card_details-box">
                <h6 class="card_details card_detail-price">{%price%}</h6>
            </div>
        </div>

        <a href="/product?id={%id%}" class="card_link">
            <span>detail<i class="emoji-right"></i></span>
        </a>
    </figure> -->
        </div>
    </div>

</body>

</html>
